services:
  anycast:
    build: .
    image: anycast:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      BUFFER_DIR: /buffer
    ports:
      - "8787:8787"
    volumes:
      - anycast-data:/data
      - anycast-buffer:/buffer
    # Describes the service for the CasaOS dashboard (ignored by plain Docker).
    x-casaos:
      ports:
        - container: "8787"
          description:
            en_us: Web app and API
      volumes:
        - container: /data
          description:
            en_us: Accounts, profiles, favorites, progress, settings and backups
        - container: /buffer
          description:
            en_us: Rewind buffer for live TV
    # Hardware transcoding (optional, see docs/casaos.md). Without it, conversions use the CPU.
    # Intel/AMD: uncomment if `ls /dev/dri` on the server lists renderD128.
    # devices:
    #   - /dev/dri:/dev/dri
    # Only if you run the container as a non-root user: the GID of the host's render group
    # (`getent group render | cut -d: -f3`), e.g.
    # group_add:
    #   - "105"
    # NVIDIA: install the NVIDIA Container Toolkit on the host, then uncomment instead:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]

volumes:
  anycast-data:
  anycast-buffer:

# Makes CasaOS show AnyCast as an app (name, icon, Open button) instead of a bare container.
# Plain Docker ignores it. CasaOS reads this file from disk, so after a change `docker compose up -d`
# is enough. Don't edit AnyCast's settings in the CasaOS UI: it rewrites the setup its own way
# (see docs/casaos.md). The Open button goes to http://<the address you opened CasaOS at>:8787;
# to open your HTTPS address instead, set ANYCAST_CASAOS_HOST (and _SCHEME, _PORT) in .env.
x-casaos:
  main: anycast
  architectures:
    - amd64
    - arm64
  author: Julz0711
  developer: Julz0711
  category: Media
  title:
    en_us: AnyCast
  tagline:
    en_us: Your IPTV on every screen
  description:
    en_us: Live TV, movies and series from your Xtream provider, with rewind, profiles and sync across devices.
  icon: data:image/svg+xml;base64,
  thumbnail: data:image/svg+xml;base64,
  screenshot_link: []
  tips: {}
  hostname: ${ANYCAST_CASAOS_HOST:-}
  scheme: ${ANYCAST_CASAOS_SCHEME:-http}
  port_map: "${ANYCAST_CASAOS_PORT:-8787}"
  index: /
